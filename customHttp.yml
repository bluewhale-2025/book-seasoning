applications:
  - appRoot: apps/web
    customHeaders:
      - pattern: "**/*"
        headers:
          - key: Strict-Transport-Security
            value: "max-age=31536000; includeSubDomains"
          - key: Content-Security-Policy
            value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api-staging.book-seasoning.com https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
          - key: Cache-Control
            value: "public, max-age=0, must-revalidate"
      - pattern: "/assets/*"
        headers:
          - key: Cache-Control
            value: "public, max-age=31536000, immutable"
