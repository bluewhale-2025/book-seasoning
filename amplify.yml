version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24.18.0
            - nvm use 24.18.0
            - corepack enable
            - corepack prepare pnpm@11.25.0 --activate
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
            - node scripts/verify-web-build-environment.mjs
        build:
          commands:
            - pnpm --filter @bookseasoning/web... build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
