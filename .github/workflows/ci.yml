name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.25.0
          runtime: node@24.18.0
          cache: true
      - run: pnpm check
      - run: pnpm db:start
      - run: pnpm check:db
      - if: always()
        run: pnpm db:stop
      - run: docker build --tag bookseasoning:${{ github.sha }} .
